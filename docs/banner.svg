<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="job-pipeline: agent-run job search, scoring, tailoring and tracking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13141c"/>
      <stop offset="1" stop-color="#252636"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c7df0"/>
      <stop offset=".5" stop-color="#7c5ce0"/>
      <stop offset="1" stop-color="#e85d9e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1170" cy="40" r="150" fill="#7c5ce0" opacity=".14"/>
  <circle cx="1090" cy="300" r="110" fill="#4c7df0" opacity=".12"/>
  <text x="80" y="140" fill="#e6e6f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">job-pipeline</text>
  <rect x="82" y="162" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="218" fill="#9a9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">search · score · tailor · track, run by Claude agents</text>
  <text x="80" y="258" fill="#9a9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" opacity=".8">one SQLite file · one dashboard · no model API key</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="860" y="112" width="120" height="40" rx="20" fill="#4c7df0" opacity=".9"/><text x="920" y="138" fill="#fff" text-anchor="middle">search</text>
    <rect x="995" y="112" width="120" height="40" rx="20" fill="#7c5ce0" opacity=".9"/><text x="1055" y="138" fill="#fff" text-anchor="middle">score</text>
    <rect x="860" y="166" width="120" height="40" rx="20" fill="#b16cea" opacity=".9"/><text x="920" y="192" fill="#fff" text-anchor="middle">tailor</text>
    <rect x="995" y="166" width="120" height="40" rx="20" fill="#e85d9e" opacity=".9"/><text x="1055" y="192" fill="#fff" text-anchor="middle">track</text>
  </g>
</svg>

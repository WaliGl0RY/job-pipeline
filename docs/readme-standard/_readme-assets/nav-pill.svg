<!--
  NAV PILL · template (README-STANDARD.md § Components → Nav pill). One per zone, top of the README.

  Placeholders:
    {{ZONE_BASE}}  zone colour, saturated          ← per repo, from the palette
    {{LABEL}}      short zone name                 e.g. Run it yourself
    {{W}}          total width  = round(len(LABEL) × 7.3 + 42)
    {{W_1}}        W − 1
    {{TEXT_X}}     label centre = 26 + (len(LABEL) × 7.3 + 2) / 2

  Fixed: height 26, pill #1c1418, label #f3e9e0, Verdana 12.
  Delete this comment block in the finished file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="{{W}}" height="26" viewBox="0 0 {{W}} 26" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12">
<rect x=".5" y=".5" width="{{W_1}}" height="25" rx="13" fill="#1c1418" stroke="{{ZONE_BASE}}"/>
<circle cx="15" cy="13" r="4" fill="{{ZONE_BASE}}"/><text x="{{TEXT_X}}" y="17.5" fill="#f3e9e0" text-anchor="middle">{{LABEL}}</text></svg>

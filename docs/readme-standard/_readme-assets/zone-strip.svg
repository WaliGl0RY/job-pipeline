<!--
  ZONE HEADER STRIP · template (see README-STANDARD.md § Components → Zone header strip)

  Placeholders:
    {{ZONE_BASE}}   zone colour, saturated     e.g. #3b82f6   ← per repo, from the palette
    {{ZONE_LIGHT}}  zone colour, light tint    e.g. #93c5fd   ← per repo, readable on #131016
    {{NN}}          zone number, two digits    01 … 05
    {{TITLE}}       zone title                 e.g. Features
    {{SUBTITLE}}    short right-aligned line   e.g. what the app does on a game night
    {{ICON}}        one icon group from icons.svg (paths only, no colours)

  Fixed (do not change per repo): size 1200×84, card #131016, muted text #b8aeb4, fonts.
  Delete this comment block in the finished file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="{{ZONE_BASE}}" stop-opacity=".28"/><stop offset=".55" stop-color="{{ZONE_BASE}}" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="83" rx="14" fill="#131016" stroke="{{ZONE_BASE}}" stroke-opacity=".45"/>
<rect x="1" y="1" width="1198" height="82" rx="14" fill="url(#g)"/>
<rect x="0" y="16" width="6" height="52" rx="3" fill="{{ZONE_BASE}}"/>
<circle cx="62" cy="42" r="24" fill="{{ZONE_BASE}}" fill-opacity=".16" stroke="{{ZONE_BASE}}" stroke-width="1.5"/>
<g transform="translate(62 42)" fill="none" stroke="{{ZONE_LIGHT}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">{{ICON}}</g>
<text x="106" y="33" fill="{{ZONE_BASE}}" font-size="12" font-weight="700" letter-spacing="3">{{NN}}</text>
<text x="104" y="60" fill="{{ZONE_LIGHT}}" font-size="27" font-weight="700" letter-spacing="-0.3">{{TITLE}}</text>
<text x="1172" y="49" fill="#b8aeb4" font-size="15" text-anchor="end">{{SUBTITLE}}</text>
</svg>

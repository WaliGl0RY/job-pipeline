<rect x="1" y="1" width="558" height="195" rx="14" fill="url(#g)"/>
<rect x="0" y="18" width="5" height="52" rx="2.5" fill="#e85d9e"/>
<rect x="30" y="24" width="46" height="26" rx="13" fill="#e85d9e"/>
<text x="53" y="42" fill="#13141c" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">06</text>
<text x="90" y="44" fill="#e6e6f0" font-size="21" font-weight="700">The public version</text>
<text x="30" y="74" fill="#b0b1c8" font-size="14">27–28 Sep 2026 · fixes 32–33</text>
<text x="30" y="104" fill="#e6e6f0" font-size="16">The bridge code came out, the interface went English, and the</text>
<text x="30" y="127" fill="#e6e6f0" font-size="16">output language became a setting.</text>
<text x="30" y="162" fill="#f5a3ca" font-size="16" font-style="italic">“What ships should be what actually runs.”</text>

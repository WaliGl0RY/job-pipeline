<svg xmlns="http://www.w3.org/2000/svg" width="560" height="197" viewBox="0 0 560 197" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<title>Phase 06: The public version. 27–28 Sep 2026 · fixes 32–33. The bridge code came out, the interface went English, and the output language became a setting. Why: “What ships should be what actually runs.”</title>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e85d9e" stop-opacity=".22"/><stop offset=".6" stop-color="#e85d9e" stop-opacity="0"/></linearGradient></defs>

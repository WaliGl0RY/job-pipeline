<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<title>Phase 01: The design with a model bill. 10–13 Jul 2026 · fixes 1–6. SQLite for tracking, a scraper for job boards and a paid model API scoring every posting, with automatic form submission. Why: “Every score cost money and nothing checked an application before it left.”</title>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e85d9e" stop-opacity=".22"/><stop offset=".6" stop-color="#e85d9e" stop-opacity="0"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="559" height="219" rx="14" fill="#13141c" stroke="#e85d9e" stroke-opacity=".45"/>
<rect x="1" y="1" width="558" height="218" rx="14" fill="url(#g)"/>
<rect x="0" y="18" width="5" height="52" rx="2.5" fill="#e85d9e"/>
<rect x="30" y="24" width="46" height="26" rx="13" fill="#e85d9e"/>
<text x="53" y="42" fill="#13141c" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">01</text>
<text x="90" y="44" fill="#e6e6f0" font-size="21" font-weight="700">The design with a model bill</text>
<text x="30" y="74" fill="#b0b1c8" font-size="14">10–13 Jul 2026 · fixes 1–6</text>
<text x="30" y="104" fill="#e6e6f0" font-size="16">SQLite for tracking, a scraper for job boards and a paid model API</text>
<text x="30" y="127" fill="#e6e6f0" font-size="16">scoring every posting, with automatic form submission.</text>
<text x="30" y="162" fill="#f5a3ca" font-size="16" font-style="italic">“Every score cost money and nothing checked an application</text>
<text x="30" y="185" fill="#f5a3ca" font-size="16" font-style="italic">before it left.”</text>
</svg>

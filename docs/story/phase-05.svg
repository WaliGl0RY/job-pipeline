<svg xmlns="http://www.w3.org/2000/svg" width="560" height="197" viewBox="0 0 560 197" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<title>Phase 05: Cast wide, then score. 5 Aug 2026 · fixes 23–31. The best-fitting posting of the search was dropped by silent filters. Exclusions became demotions and every reject is logged. Why: “You can't judge a posting you never see.”</title>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e85d9e" stop-opacity=".22"/><stop offset=".6" stop-color="#e85d9e" stop-opacity="0"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="559" height="196" rx="14" fill="#13141c" stroke="#e85d9e" stroke-opacity=".45"/>
<rect x="1" y="1" width="558" height="195" rx="14" fill="url(#g)"/>
<rect x="0" y="18" width="5" height="52" rx="2.5" fill="#e85d9e"/>
<rect x="30" y="24" width="46" height="26" rx="13" fill="#e85d9e"/>
<text x="53" y="42" fill="#13141c" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">05</text>
<text x="90" y="44" fill="#e6e6f0" font-size="21" font-weight="700">Cast wide, then score</text>
<text x="30" y="74" fill="#b0b1c8" font-size="14">5 Aug 2026 · fixes 23–31</text>
<text x="30" y="104" fill="#e6e6f0" font-size="16">The best-fitting posting of the search was dropped by silent filters.</text>
<text x="30" y="127" fill="#e6e6f0" font-size="16">Exclusions became demotions and every reject is logged.</text>
<text x="30" y="162" fill="#f5a3ca" font-size="16" font-style="italic">“You can't judge a posting you never see.”</text>
</svg>

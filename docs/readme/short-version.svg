<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="196" viewBox="0 0 1200 196" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241f52"/><stop offset="1" stop-color="#16132e"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="195" rx="16" fill="url(#c)" stroke="#6f6fd0"/>
<rect x="0" y="18" width="7" height="160" rx="3.5" fill="#8b8bf0"/>
<text x="34" y="40" fill="#8b8bf0" font-size="13" font-weight="700" letter-spacing="3.5">THE SHORT VERSION</text>
<text x="34" y="74" fill="#e9e7ff" font-size="18">It began on 10 July as a design where a paid model API scored every job</text>
<text x="34" y="102" fill="#e9e7ff" font-size="18">and forms were submitted automatically. Bugs reshaped it: a blank dashboard,</text>
<text x="34" y="130" fill="#e9e7ff" font-size="18">a stale database journal, drifting rules, silent filters.</text>
<text x="34" y="158" fill="#e9e7ff" font-size="18">Now: agent routines around one SQLite file, no API key, a human before every application.</text>
</svg>

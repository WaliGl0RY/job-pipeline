<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241f52"/><stop offset="1" stop-color="#14112b"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5ce0"/><stop offset="1" stop-color="#b16cea"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="url(#bg)" stroke="#5a55b8" stroke-opacity=".7"/>
